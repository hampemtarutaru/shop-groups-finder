name: K-089 Browser smoke QA
on:
  pull_request:
    paths:
      - 'public/**'
      - 'qa/site-smoke/**'
      - '.github/workflows/k089-browser-smoke.yml'
  push:
    branches: [k089/formalize-service-copy-20261109]
    paths:
      - 'public/**'
      - 'qa/site-smoke/**'
      - '.github/workflows/k089-browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/k089-server.log 2>&1 &
          echo $! > /tmp/k089-server.pid
      - name: Run Chromium smoke checks (desktop + mobile)
        run: node qa/site-smoke/smoke.mjs
      - name: Upload preview screenshots (for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k089-browser-smoke-screenshots
          path: qa-results/*.png
          if-no-files-found: ignore
          retention-days: 7
