name: K-089 hierarchy PoC verification
on:
  pull_request:
    paths:
      - 'qa/hierarchy-poc/**'
      - 'scripts/k089_hierarchy_poc*.mjs'
      - '.github/workflows/k089-hierarchy-poc.yml'
      - 'public/data.json'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/k089_hierarchy_poc.test.mjs
      - run: node scripts/k089_hierarchy_poc.mjs
      - run: git diff --exit-code -- qa/hierarchy-poc/
      - run: node scripts/k089_hierarchy_poc.mjs && git diff --exit-code -- qa/hierarchy-poc/
      - name: Install pinned Chromium/Playwright for isolated browser verification
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test local snapshots at 320px, 375px, 768px, 1280px
        run: node qa/hierarchy-poc/browser-smoke.mjs
      - name: Save screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k089-hierarchy-layout-review
          path: qa-results/*.png
          if-no-files-found: ignore
          retention-days: 7
